<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3-4B-Base student baseline evaluation</title>
  <desc id="desc">Bar chart showing AIME25 exact match 3.33 percent, AIME26 exact match 6.67 percent, IFBench prompt loose 18.33 percent, IFEval prompt loose 42.70 percent, and LiveCodeBench pass at one 15.26 percent.</desc>
  <rect width="1200" height="650" fill="#fbfcfe"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033">Qwen3-4B-Base: Student Baseline</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667085">Evaluation before FedAvg MOPSD training</text>

  <g stroke="#d8dee8" stroke-width="1">
    <line x1="100" y1="530" x2="1140" y2="530"/>
    <line x1="100" y1="455" x2="1140" y2="455" stroke-dasharray="5 5"/>
    <line x1="100" y1="380" x2="1140" y2="380" stroke-dasharray="5 5"/>
    <line x1="100" y1="305" x2="1140" y2="305" stroke-dasharray="5 5"/>
    <line x1="100" y1="230" x2="1140" y2="230" stroke-dasharray="5 5"/>
    <line x1="100" y1="155" x2="1140" y2="155" stroke-dasharray="5 5"/>
    <line x1="100" y1="80" x2="1140" y2="80" stroke-dasharray="5 5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#667085" text-anchor="end">
    <text x="90" y="535">0</text><text x="90" y="460">10</text><text x="90" y="385">20</text>
    <text x="90" y="310">30</text><text x="90" y="235">40</text><text x="90" y="160">50</text><text x="90" y="85">60</text>
  </g>
  <text x="30" y="305" transform="rotate(-90 30 305)" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#344054">Score (%)</text>

  <g>
    <rect x="140" y="505.0" width="140" height="25.0" rx="4" fill="#4e79a7"/>
    <rect x="350" y="480.0" width="140" height="50.0" rx="4" fill="#4e79a7"/>
    <rect x="560" y="392.5" width="140" height="137.5" rx="4" fill="#f28e2b"/>
    <rect x="770" y="209.8" width="140" height="320.2" rx="4" fill="#f28e2b"/>
    <rect x="980" y="415.6" width="140" height="114.4" rx="4" fill="#59a14f"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="210" y="492">3.33%</text>
    <text x="420" y="467">6.67%</text>
    <text x="630" y="379">18.33%</text>
    <text x="840" y="196">42.70%</text>
    <text x="1050" y="402">15.26%</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#344054">
    <text x="210" y="563" font-size="16" font-weight="700">AIME25</text><text x="210" y="584" font-size="13">Exact Match</text>
    <text x="420" y="563" font-size="16" font-weight="700">AIME26</text><text x="420" y="584" font-size="13">Exact Match</text>
    <text x="630" y="563" font-size="16" font-weight="700">IFBench</text><text x="630" y="584" font-size="13">Prompt Loose</text>
    <text x="840" y="563" font-size="16" font-weight="700">IFEval</text><text x="840" y="584" font-size="13">Prompt Loose</text>
    <text x="1050" y="563" font-size="16" font-weight="700">LiveCodeBench</text><text x="1050" y="584" font-size="13">Pass@1</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#667085">
    <rect x="430" y="615" width="14" height="14" rx="2" fill="#4e79a7"/><text x="452" y="627">Math</text>
    <rect x="555" y="615" width="14" height="14" rx="2" fill="#f28e2b"/><text x="577" y="627">Instruction Following</text>
    <rect x="755" y="615" width="14" height="14" rx="2" fill="#59a14f"/><text x="777" y="627">Code</text>
  </g>
</svg>
