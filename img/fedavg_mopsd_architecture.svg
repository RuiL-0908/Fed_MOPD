<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">FedAvg MOPSD architecture</title>
  <desc id="desc">A server distributes the same Qwen3-4B-Base initialization to Math, Instruction Following, and Code clients. Each client performs on-policy self-distillation with a privileged frozen teacher and uploads its trained student weights for FedAvg.</desc>
  <defs>
    <linearGradient id="serverFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <linearGradient id="mathFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#dceaff"/>
    </linearGradient>
    <linearGradient id="ifFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5e9"/>
      <stop offset="1" stop-color="#ffe5c4"/>
    </linearGradient>
    <linearGradient id="codeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff9ec"/>
      <stop offset="1" stop-color="#d9f0d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#172033" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4472c4"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d65f4a"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#fbfcfe"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">FedAvg MOPSD</text>

  <g filter="url(#shadow)">
    <rect x="345" y="62" width="510" height="190" rx="20" fill="url(#serverFill)" stroke="#4472c4" stroke-width="2.5"/>
  </g>
  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#24447a">SERVER</text>
  <rect x="385" y="116" width="200" height="96" rx="12" fill="#ffffff" stroke="#7b9bd1" stroke-width="1.5"/>
  <text x="485" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#25334d">Global Student</text>
  <text x="485" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#44516a">Qwen3-4B-Base</text>
  <text x="485" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#44516a">initial weights θ⁽⁰⁾</text>
  <rect x="615" y="116" width="200" height="96" rx="12" fill="#ffffff" stroke="#7b9bd1" stroke-width="1.5"/>
  <text x="715" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#25334d">FedAvg</text>
  <text x="715" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#44516a">Σₖ (nₖ / N) θₖ</text>
  <text x="715" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#44516a">→ global weights θ⁽¹⁾</text>

  <path d="M470 252 C390 290 270 288 215 350" fill="none" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowDown)"/>
  <path d="M600 252 L600 350" fill="none" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowDown)"/>
  <path d="M730 252 C810 290 930 288 985 350" fill="none" stroke="#4472c4" stroke-width="3" marker-end="url(#arrowDown)"/>
  <text x="600" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4472c4">distribute the same θ⁽⁰⁾</text>

  <path d="M165 350 C190 292 335 282 425 247" fill="none" stroke="#d65f4a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowUp)"/>
  <path d="M550 350 L550 257" fill="none" stroke="#d65f4a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowUp)"/>
  <path d="M935 350 C910 292 765 282 675 247" fill="none" stroke="#d65f4a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowUp)"/>
  <text x="600" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c84f3d">upload θ_math, θ_IF, θ_code</text>

  <g filter="url(#shadow)">
    <rect x="35" y="365" width="350" height="400" rx="18" fill="url(#mathFill)" stroke="#4e79a7" stroke-width="2.5"/>
    <rect x="425" y="365" width="350" height="400" rx="18" fill="url(#ifFill)" stroke="#f28e2b" stroke-width="2.5"/>
    <rect x="815" y="365" width="350" height="400" rx="18" fill="url(#codeFill)" stroke="#59a14f" stroke-width="2.5"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="210" y="405" text-anchor="middle" font-size="22" font-weight="700" fill="#315d89">MATH CLIENT</text>
    <text x="210" y="432" text-anchor="middle" font-size="14" fill="#405064">OpenThoughts Math · 2,000</text>
    <rect x="70" y="454" width="280" height="64" rx="10" fill="#ffffff" stroke="#83a5ca"/>
    <text x="210" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Student θ_math sees x</text>
    <text x="210" y="503" text-anchor="middle" font-size="13" fill="#536078">on-policy rollout ŷ</text>
    <rect x="70" y="535" width="280" height="64" rx="10" fill="#ffffff" stroke="#83a5ca"/>
    <text x="210" y="561" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Frozen Teacher φ sees x, y*</text>
    <text x="210" y="584" text-anchor="middle" font-size="13" fill="#536078">scores the same rollout prefix</text>
    <rect x="70" y="616" width="280" height="92" rx="10" fill="#ffffff" stroke="#83a5ca"/>
    <text x="210" y="644" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Forward KL</text>
    <text x="210" y="670" text-anchor="middle" font-size="14" fill="#536078">KL(pᵀ || pˢ)</text>
    <text x="210" y="694" text-anchor="middle" font-size="13" fill="#536078">full-parameter Student update</text>
    <text x="210" y="740" text-anchor="middle" font-size="14" font-weight="700" fill="#315d89">output: θ_math</text>

    <text x="600" y="405" text-anchor="middle" font-size="22" font-weight="700" fill="#b56814">IF CLIENT</text>
    <text x="600" y="432" text-anchor="middle" font-size="14" fill="#405064">Tulu 3 IF · 2,000</text>
    <rect x="460" y="454" width="280" height="64" rx="10" fill="#ffffff" stroke="#eab16f"/>
    <text x="600" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Student θ_IF sees x</text>
    <text x="600" y="503" text-anchor="middle" font-size="13" fill="#536078">on-policy rollout ŷ</text>
    <rect x="460" y="535" width="280" height="64" rx="10" fill="#ffffff" stroke="#eab16f"/>
    <text x="600" y="561" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Frozen Teacher φ sees x, y*</text>
    <text x="600" y="584" text-anchor="middle" font-size="13" fill="#536078">scores the same rollout prefix</text>
    <rect x="460" y="616" width="280" height="92" rx="10" fill="#ffffff" stroke="#eab16f"/>
    <text x="600" y="644" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Forward KL</text>
    <text x="600" y="670" text-anchor="middle" font-size="14" fill="#536078">KL(pᵀ || pˢ)</text>
    <text x="600" y="694" text-anchor="middle" font-size="13" fill="#536078">full-parameter Student update</text>
    <text x="600" y="740" text-anchor="middle" font-size="14" font-weight="700" fill="#b56814">output: θ_IF</text>

    <text x="990" y="405" text-anchor="middle" font-size="22" font-weight="700" fill="#397335">CODE CLIENT</text>
    <text x="990" y="432" text-anchor="middle" font-size="14" fill="#405064">rStar-Coder seed_sft · 2,000</text>
    <rect x="850" y="454" width="280" height="64" rx="10" fill="#ffffff" stroke="#88bc82"/>
    <text x="990" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Student θ_code sees x</text>
    <text x="990" y="503" text-anchor="middle" font-size="13" fill="#536078">on-policy rollout ŷ</text>
    <rect x="850" y="535" width="280" height="64" rx="10" fill="#ffffff" stroke="#88bc82"/>
    <text x="990" y="561" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Frozen Teacher φ sees x, y*</text>
    <text x="990" y="584" text-anchor="middle" font-size="13" fill="#536078">scores the same rollout prefix</text>
    <rect x="850" y="616" width="280" height="92" rx="10" fill="#ffffff" stroke="#88bc82"/>
    <text x="990" y="644" text-anchor="middle" font-size="15" font-weight="700" fill="#26354d">Forward KL</text>
    <text x="990" y="670" text-anchor="middle" font-size="14" fill="#536078">KL(pᵀ || pˢ)</text>
    <text x="990" y="694" text-anchor="middle" font-size="13" fill="#536078">full-parameter Student update</text>
    <text x="990" y="740" text-anchor="middle" font-size="14" font-weight="700" fill="#397335">output: θ_code</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13">
    <line x1="380" y1="795" x2="420" y2="795" stroke="#4472c4" stroke-width="3"/>
    <text x="430" y="800" fill="#405064">server → client initialization</text>
    <line x1="680" y1="795" x2="720" y2="795" stroke="#d65f4a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="730" y="800" fill="#405064">client → server weights</text>
  </g>
</svg>
